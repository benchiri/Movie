<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 My Movie AI App</title>
    <style>
        :root {
            --bg: #0a0a14;
            --surface: #141428;
            --card: #1a1a30;
            --gold: #e2b04a;
            --gold-glow: #f0c860;
            --cyan: #4dc9f6;
            --text: #d1d5db;
            --text-secondary: #9ca3af;
            --muted: #6b7280;
            --danger: #ef4444;
            --success: #22c55e;
            --border: #252540;
            --radius: 14px;
            --radius-sm: 8px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-card: 0 4px 24px rgba(0, 0, 0, 0.5), 0 1px 3px rgba(255, 255, 255, 0.04);
            --shadow-glow: 0 0 30px rgba(226, 176, 74, 0.25);
            --font-heading: 'Georgia', 'Times New Roman', serif;
            --font-mono: 'SF Mono', 'Cascadia Code', 'Consolas', monospace;
            --font-body: 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            background-image:
                radial-gradient(ellipse at 20% 20%, rgba(226, 176, 74, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 60%, rgba(77, 201, 246, 0.03) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 100%, rgba(139, 92, 246, 0.03) 0%, transparent 50%);
            background-attachment: fixed;
            line-height: 1.6;
        }

        /* ── Layout ─────────────────────── */
        .app-container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px 24px 60px;
        }

        /* ── Header ────────────────────── */
        .app-header {
            text-align: center;
            padding: 28px 0 10px;
            position: relative;
        }
        .app-header .logo-icon {
            font-size: 56px;
            display: block;
            animation: float 3s ease-in-out infinite;
            filter: drop-shadow(0 4px 20px rgba(226, 176, 74, 0.4));
            letter-spacing: 4px;
        }
        @keyframes float {
            0%,
            100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }
        .app-header h1 {
            font-family: var(--font-heading);
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: 0.04em;
            background: linear-gradient(180deg, #fde68a 0%, #d4a44a 60%, #b8861e 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-top: 2px;
        }
        .app-header .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-top: -2px;
        }

        /* ── Toolbar ───────────────────── */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 16px;
            align-items: center;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--transition);
            white-space: nowrap;
            font-family: var(--font-body);
            letter-spacing: 0.02em;
            position: relative;
            overflow: hidden;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-gold {
            background: linear-gradient(135deg, #d4a44a 0%, #b8861e 100%);
            color: #0a0a14;
            border: none;
            font-weight: 700;
            box-shadow: 0 2px 12px rgba(226, 176, 74, 0.3);
        }
        .btn-gold:hover {
            box-shadow: 0 4px 24px rgba(226, 176, 74, 0.5);
            transform: translateY(-2px);
        }
        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .btn-outline:hover {
            border-color: var(--gold);
            color: var(--gold-glow);
            box-shadow: 0 0 16px rgba(226, 176, 74, 0.15);
        }
        .btn-sm {
            padding: 6px 14px;
            font-size: 0.78rem;
            border-radius: 30px;
        }
        .btn-icon {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            justify-content: center;
            font-size: 1.1rem;
        }
        .btn-danger {
            background: transparent;
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #f87171;
        }
        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.12);
            border-color: #ef4444;
            box-shadow: 0 0 16px rgba(239, 68, 68, 0.2);
        }
        .btn:disabled {
            opacity: 0.4;
            pointer-events: none;
            cursor: not-allowed;
        }

        /* ── Voice Selector ────────────── */
        .voice-panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 14px 18px;
            margin-bottom: 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            align-items: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
        }
        .voice-panel label {
            font-weight: 600;
            color: var(--text);
            letter-spacing: 0.03em;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        .voice-panel select {
            background: var(--card);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 30px;
            font-size: 0.85rem;
            cursor: pointer;
            font-family: var(--font-body);
            min-width: 160px;
            transition: var(--transition);
        }
        .voice-panel select:hover {
            border-color: var(--gold);
        }
        .voice-panel select:focus {
            outline: none;
            border-color: var(--gold-glow);
            box-shadow: 0 0 0 3px rgba(226, 176, 74, 0.1);
        }

        /* ── Textarea ──────────────────── */
        .script-input-wrap {
            position: relative;
            margin-bottom: 16px;
        }
        .script-input-wrap textarea {
            width: 100%;
            height: 220px;
            background: var(--surface);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 18px 20px;
            font-family: var(--font-mono);
            font-size: 0.9rem;
            line-height: 1.7;
            resize: vertical;
            transition: var(--transition);
            letter-spacing: 0.01em;
        }
        .script-input-wrap textarea::placeholder {
            color: var(--muted);
            font-style: italic;
        }
        .script-input-wrap textarea:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 4px rgba(226, 176, 74, 0.06), var(--shadow-glow);
        }
        .char-count {
            position: absolute;
            bottom: 12px;
            right: 16px;
            font-size: 0.7rem;
            color: var(--muted);
            pointer-events: none;
            background: var(--surface);
            padding: 4px 10px;
            border-radius: 20px;
            letter-spacing: 0.04em;
        }

        /* ── Stats Bar ─────────────────── */
        .stats-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            justify-content: center;
            padding: 12px 0 6px;
            font-size: 0.8rem;
            color: var(--muted);
            letter-spacing: 0.03em;
        }
        .stat {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--surface);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--border);
        }
        .stat strong {
            color: var(--gold-glow);
            font-weight: 700;
        }

        /* ── Scene Cards ───────────────── */
        #output {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-top: 10px;
        }
        .scene-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow-card);
            transition: var(--transition);
            animation: fadeInUp 0.45s ease forwards;
            opacity: 0;
            position: relative;
        }
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(24px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .scene-card.playing {
            border-color: var(--gold);
            box-shadow: var(--shadow-glow), var(--shadow-card);
            animation: pulseGlow 1.5s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(226, 176, 74, 0.25), var(--shadow-card);
            }
            50% {
                box-shadow: 0 0 40px rgba(226, 176, 74, 0.5), var(--shadow-card);
            }
        }
        .scene-card:hover {
            border-color: #3a3a55;
            transform: translateY(-2px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), 0 2px 6px rgba(255, 255, 255, 0.03);
        }
        .scene-card.playing:hover {
            border-color: var(--gold);
            transform: translateY(-2px);
        }

        /* ── Scene Image ───────────────── */
        .scene-image-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            overflow: hidden;
            background: #0d0d1f;
            cursor: pointer;
        }
        .scene-image-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.6s ease;
        }
        .scene-image-wrap:hover img {
            transform: scale(1.04);
        }
        .scene-image-overlay {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: linear-gradient(to top,
                    rgba(10, 10, 20, 0.95) 0%,
                    rgba(10, 10, 20, 0.5) 30%,
                    rgba(10, 10, 20, 0.1) 65%,
                    rgba(10, 10, 20, 0.0) 100%);
            z-index: 2;
        }
        .scene-badge {
            position: absolute;
            top: 14px;
            left: 14px;
            z-index: 3;
            background: rgba(10, 10, 20, 0.85);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: var(--gold-glow);
            font-weight: 700;
            font-size: 0.78rem;
            padding: 6px 13px;
            border-radius: 30px;
            letter-spacing: 0.06em;
            border: 1px solid rgba(226, 176, 74, 0.3);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .scene-badge .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--gold-glow);
            box-shadow: 0 0 8px var(--gold-glow);
        }
        .scene-time-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 3;
            background: rgba(10, 10, 20, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #fff;
            font-size: 0.72rem;
            padding: 5px 10px;
            border-radius: 20px;
            letter-spacing: 0.04em;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* ── Scene Content ─────────────── */
        .scene-content {
            padding: 18px 20px 14px;
            position: relative;
            z-index: 1;
        }
        .scene-heading {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--gold-glow);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            margin-bottom: 8px;
            word-break: break-word;
        }
        .scene-action {
            color: #b0b7c3;
            font-size: 0.88rem;
            margin-bottom: 10px;
            line-height: 1.7;
            font-style: italic;
            letter-spacing: 0.02em;
        }
        .dialogue-block {
            margin: 8px 0;
            padding-left: 16px;
            border-left: 3px solid var(--border);
            transition: var(--transition);
        }
        .dialogue-block:hover {
            border-left-color: var(--cyan);
        }
        .dialogue-character {
            font-weight: 700;
            color: var(--cyan);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-size: 0.82rem;
            margin-bottom: 2px;
        }
        .dialogue-parenthetical {
            color: #9ca3af;
            font-size: 0.78rem;
            font-style: italic;
            margin-bottom: 2px;
        }
        .dialogue-text {
            color: #e5e7eb;
            font-size: 0.9rem;
            line-height: 1.6;
        }

        /* ── Scene Controls ────────────── */
        .scene-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 0 20px 16px;
            align-items: center;
        }
        .scene-controls .btn {
            font-size: 0.78rem;
            padding: 7px 14px;
        }

        /* ── Playback indicator ────────── */
        .playback-bar {
            display: none;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            background: var(--surface);
            border-radius: 50px;
            border: 1px solid var(--gold);
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), var(--shadow-glow);
            animation: fadeInUp 0.3s ease;
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 0.03em;
        }
        .playback-bar.active {
            display: flex;
        }
        .playback-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--gold-glow);
            animation: blink 0.7s ease-in-out infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
                box-shadow: 0 0 10px var(--gold-glow);
            }
            50% {
                opacity: 0.3;
                box-shadow: 0 0 2px var(--gold-glow);
            }
        }

        /* ── Empty State ───────────────── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }
        .empty-state .icon {
            font-size: 64px;
            display: block;
            margin-bottom: 12px;
            opacity: 0.6;
        }
        .empty-state p {
            font-size: 0.95rem;
            letter-spacing: 0.03em;
        }

        /* ── Toast ─────────────────────── */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--surface);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.85rem;
            z-index: 200;
            border: 1px solid var(--border);
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none;
            letter-spacing: 0.03em;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        .toast.success {
            border-color: var(--success);
            color: #4ade80;
        }

        /* ── Responsive ────────────────── */
        @media (max-width: 640px) {
            .app-header h1 {
                font-size: 1.6rem;
            }
            .app-header .logo-icon {
                font-size: 40px;
            }
            .toolbar {
                gap: 6px;
            }
            .btn {
                padding: 8px 14px;
                font-size: 0.78rem;
            }
            .script-input-wrap textarea {
                height: 160px;
                font-size: 0.8rem;
            }
            .scene-content {
                padding: 12px 14px 10px;
            }
            .scene-controls {
                padding: 0 14px 12px;
            }
            .voice-panel {
                flex-direction: column;
                align-items: stretch;
            }
            .voice-panel select {
                width: 100%;
            }
            .playback-bar {
                bottom: 12px;
                font-size: 0.75rem;
                padding: 8px 14px;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <span class="logo-icon">🎬</span>
            <h1>My Movie AI App</h1>
            <p class="subtitle">Screenplay → Storyboard → Voice</p>
        </header>

        <!-- Toolbar -->
        <div class="toolbar">
            <button class="btn btn-outline btn-sm" onclick="loadExample()" title="Load a sample screenplay">📋 Load Example</button>
            <button class="btn btn-outline btn-sm" onclick="saveScript()" title="Save script to browser storage">💾 Save</button>
            <button class="btn btn-outline btn-sm" onclick="loadScript()" title="Load saved script">📂 Load</button>
            <button class="btn btn-outline btn-sm" onclick="exportScript()" title="Download formatted script">📥 Export .txt</button>
            <button class="btn btn-outline btn-sm" onclick="copyScript()" title="Copy formatted script">📝 Copy</button>
            <button class="btn btn-danger btn-sm" onclick="clearAll()" title="Clear everything">🗑 Clear</button>
        </div>

        <!-- Voice Settings -->
        <div class="voice-panel" id="voicePanel">
            <label>🎙 Global Voice:</label>
            <select id="globalVoice" onchange="onGlobalVoiceChange()">
                <option value="">Loading voices...</option>
            </select>
            <span style="font-size:0.7rem;color:var(--muted);">(Scene-specific overrides available per card)</span>
        </div>

        <!-- Script Input -->
        <div class="script-input-wrap">
            <textarea id="script"
            placeholder="Write or paste your screenplay here...&#10;&#10;Use standard format:&#10;INT. COFFEE SHOP - DAY&#10;Action description text...&#10;CHARACTER NAME&#10;Dialogue goes here...&#10;&#10;Or just write plain text — each line becomes a scene."
        oninput="updateCharCount()"></textarea>
        <span class="char-count" id="charCount">0 chars</span>
    </div>

    <!-- Generate Button -->
    <div style="text-align:center;margin-bottom:12px;">
        <button class="btn btn-gold" onclick="generate()" style="font-size:1rem;padding:14px 36px;">
            🎥 Generate Movie
        </button>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar" style="display:none;">
        <span class="stat">🎬 Scenes: <strong id="statScenes">0</strong></span>
        <span class="stat">👤 Characters: <strong id="statChars">0</strong></span>
        <span class="stat">⏱ Est. Duration: <strong id="statDuration">0s</strong></span>
        <span class="stat">📝 Words: <strong id="statWords">0</strong></span>
    </div>

    <!-- Output -->
    <div id="output">
        <div class="empty-state">
            <span class="icon">🎞️</span>
            <p>Write a script and click <strong>"Generate Movie"</strong><br>to see your storyboard come to life.</p>
        </div>
    </div>

    <!-- Playback Bar -->
    <div class="playback-bar" id="playbackBar">
        <span class="playback-dot"></span>
        <span id="playbackLabel">Playing Scene 1...</span>
        <button class="btn btn-danger btn-sm" onclick="stopPlayback()" style="margin-left:8px;">⏹ Stop</button>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>
</div>

<script>
    // ──────────────────────────────────────
    //  STATE
    // ──────────────────────────────────────
    let parsedScenes = [];
    let isPlayingAll = false;
    let currentPlayIndex = -1;
    let availableVoices = [];
    let globalVoiceId = '';

    // ──────────────────────────────────────
    //  INIT: Load voices
    // ──────────────────────────────────────
    function initVoices() {
        const populate = () => {
            availableVoices = speechSynthesis.getVoices().filter(v => v.lang.startsWith('en'));
            if (availableVoices.length === 0) {
                availableVoices = speechSynthesis.getVoices();
            }
            const sel = document.getElementById('globalVoice');
            sel.innerHTML = '';
            if (availableVoices.length === 0) {
                sel.innerHTML = '<option value="">No voices available</option>';
                return;
            }
            availableVoices.forEach((v, i) => {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${v.name} (${v.lang}) ${v.gender === 'female' ? '♀' : v.gender === 'male' ? '♂' : ''}`;
                sel.appendChild(opt);
            });
            // Default to first voice or restore saved preference
            const savedVoice = localStorage.getItem('movieai_globalVoice');
            if (savedVoice !== null && parseInt(savedVoice) < availableVoices.length) {
                sel.value = savedVoice;
                globalVoiceId = parseInt(savedVoice);
            } else if (availableVoices.length > 0) {
                globalVoiceId = 0;
                sel.value = '0';
            }
        };
        populate();
        speechSynthesis.onvoiceschanged = populate;
    }
    initVoices();

    function onGlobalVoiceChange() {
        globalVoiceId = parseInt(document.getElementById('globalVoice').value);
        if (!isNaN(globalVoiceId)) {
            localStorage.setItem('movieai_globalVoice', globalVoiceId);
        }
    }

    // ──────────────────────────────────────
    //  SCREENPLAY PARSER
    // ──────────────────────────────────────
    function parseScreenplay(rawText) {
        const lines = rawText.split('\n');
        const blocks = [];
        let currentBlock = [];

        // Split into blocks by blank lines
        for (const line of lines) {
            if (line.trim() === '') {
                if (currentBlock.length > 0) {
                    blocks.push(currentBlock);
                    currentBlock = [];
                }
            } else {
                currentBlock.push(line);
            }
        }
        if (currentBlock.length > 0) blocks.push(currentBlock);

        const scenes = [];
        let currentScene = null;

        function flushScene() {
            if (currentScene && (currentScene.heading || currentScene.actionLines.length > 0 ||
                    currentScene.dialogueBlocks.length > 0)) {
                scenes.push(currentScene);
            }
            currentScene = null;
        }

        for (const block of blocks) {
            const firstLine = block[0].trim();
            const isSceneHeading =
                /^(INT\.|EXT\.|INT\/EXT|INTERIOR|EXTERIOR|I\.|E\.)[\s\.\-]/i.test(firstLine) ||
                /^[A-Z\s]{4,30}\s*(-\s*(DAY|NIGHT|MORNING|EVENING|AFTERNOON|DAWN|DUSK|CONTINUOUS|CONT\.?|LATER|MOMENTS?\s*LATER)\s*)$/i
                .test(firstLine);

            if (isSceneHeading) {
                flushScene();
                currentScene = {
                    heading: firstLine,
                    actionLines: [],
                    dialogueBlocks: [],
                    rawBlock: block,
                };
                // Add remaining lines in block as action (until we hit dialogue)
                let i = 1;
                while (i < block.length) {
                    const ln = block[i].trim();
                    // Check if this line looks like a CHARACTER name (ALL CAPS, not too long, not a scene heading)
                    if (/^[A-Z][A-Z\s\.']{1,35}$/.test(ln) && !/^(INT\.|EXT\.|INTERIOR|EXTERIOR)/i.test(ln) &&
                        ln.length < 40 && ln === ln.toUpperCase() && ln.length > 1) {
                        // Could be a character name — next line(s) might be dialogue
                        const charName = ln;
                        let parenthetical = null;
                        let dialogueLines = [];
                        let j = i + 1;
                        // Check for parenthetical
                        if (j < block.length && /^\(.+\)$/.test(block[j].trim())) {
                            parenthetical = block[j].trim();
                            j++;
                        }
                        // Collect dialogue lines until blank or next character
                        while (j < block.length &&
                            block[j].trim() !== '' &&
                            !(/^[A-Z][A-Z\s\.']{1,35}$/.test(block[j].trim()) &&
                                !/^(INT\.|EXT\.|INTERIOR|EXTERIOR)/i.test(block[j].trim()) &&
                                block[j].trim() === block[j].trim().toUpperCase() &&
                                block[j].trim().length < 40)) {
                            dialogueLines.push(block[j].trim());
                            j++;
                        }
                        if (dialogueLines.length > 0) {
                            currentScene.dialogueBlocks.push({
                                character: charName,
                                parenthetical: parenthetical,
                                dialogue: dialogueLines.join(' '),
                            });
                        } else {
                            // It was just an ALL CAPS line, treat as action
                            currentScene.actionLines.push(ln);
                        }
                        i = j;
                    } else {
                        currentScene.actionLines.push(ln);
                        i++;
                    }
                }
            } else {
                // Not a scene heading — either continue current scene or create a simple scene
                if (currentScene) {
                    // Add block to current scene as action
                    for (const ln of block) {
                        const trimmed = ln.trim();
                        if (/^[A-Z][A-Z\s\.']{1,35}$/.test(trimmed) && !/^(INT\.|EXT\.)/i.test(trimmed) &&
                            trimmed === trimmed.toUpperCase() && trimmed.length < 40 && trimmed.length > 1) {
                            const charName = trimmed;
                            const nextIdx = block.indexOf(ln) + 1;
                            let parenthetical = null;
                            let dialogueLines = [];
                            let j = nextIdx;
                            if (j < block.length && /^\(.+\)$/.test(block[j].trim())) {
                                parenthetical = block[j].trim();
                                j++;
                            }
                            while (j < block.length && block[j].trim() !== '' &&
                                !(/^[A-Z][A-Z\s\.']{1,35}$/.test(block[j].trim()) &&
                                    block[j].trim() === block[j].trim().toUpperCase())) {
                                dialogueLines.push(block[j].trim());
                                j++;
                            }
                            if (dialogueLines.length > 0) {
                                currentScene.dialogueBlocks.push({
                                    character: charName,
                                    parenthetical: parenthetical,
                                    dialogue: dialogueLines.join(' '),
                                });
                            } else {
                                currentScene.actionLines.push(trimmed);
                            }
                        } else {
                            currentScene.actionLines.push(trimmed);
                        }
                    }
                } else {
                    // No current scene — treat the whole block as a simple scene
                    const combined = block.map(l => l.trim()).filter(l => l).join(' ');
                    if (combined) {
                        scenes.push({
                            heading: null,
                            actionLines: [combined],
                            dialogueBlocks: [],
                            rawBlock: block,
                            isSimple: true,
                        });
                    }
                }
            }
        }
        flushScene();

        // If no scenes were parsed at all, fall back to line-by-line
        if (scenes.length === 0) {
            const nonEmpty = rawText.split('\n').map(l => l.trim()).filter(l => l);
            nonEmpty.forEach(line => {
                scenes.push({
                    heading: null,
                    actionLines: [line],
                    dialogueBlocks: [],
                    rawBlock: [line],
                    isSimple: true,
                });
            });
        }

        return scenes;
    }

    // ──────────────────────────────────────
    //  EXTRACT CHARACTERS
    // ──────────────────────────────────────
    function extractCharacters(scenes) {
        const chars = new Set();
        scenes.forEach(scene => {
            scene.dialogueBlocks.forEach(db => chars.add(db.character));
        });
        return Array.from(chars);
    }

    // ──────────────────────────────────────
    //  GET SCENE IMAGE SEED
    // ──────────────────────────────────────
    function getSceneImageSeed(scene, index) {
        if (scene.heading) {
            const parts = scene.heading.replace(/[^a-zA-Z0-9\s]/g, '').toLowerCase().split(/\s+/);
            const keywords = parts.filter(w => w.length > 2 && !['int', 'ext', 'day', 'night', 'morning',
                'evening', 'afternoon', 'dusk', 'dawn', 'continuous', 'cont', 'later', 'moments'
            ].includes(w));
            if (keywords.length > 0) return keywords.slice(0, 3).join('-') + '-' + index;
        }
        return 'scene-' + index;
    }

    // ──────────────────────────────────────
    //  GET SCENE TIME ICON
    // ──────────────────────────────────────
    function getTimeInfo(heading) {
        if (!heading) return { icon: '🎬', label: 'Scene' };
        const h = heading.toUpperCase();
        if (h.includes('NIGHT') || h.includes('DUSK')) return { icon: '🌙', label: 'Night' };
        if (h.includes('DAWN') || h.includes('MORNING')) return { icon: '🌅', label: 'Morning' };
        if (h.includes('EVENING') || h.includes('AFTERNOON')) return { icon: '🌤', label: 'Afternoon' };
        if (h.includes('DAY')) return { icon: '☀️', label: 'Day' };
        return { icon: '🎬', label: 'Scene' };
    }
    function getLocationType(heading) {
        if (!heading) return '🎭';
        const h = heading.toUpperCase();
        if (h.startsWith('INT.') || h.startsWith('INTERIOR')) return '🏠';
        if (h.startsWith('EXT.') || h.startsWith('EXTERIOR')) return '🌳';
        if (h.includes('INT/EXT')) return '🚪';
        return '📍';
    }

    // ──────────────────────────────────────
    //  RENDER SCENES
    // ──────────────────────────────────────
    function renderScenes(scenes) {
        const output = document.getElementById('output');
        const statsBar = document.getElementById('statsBar');
        output.innerHTML = '';

        if (scenes.length === 0) {
            output.innerHTML = `
            <div class="empty-state">
              <span class="icon">📭</span>
              <p>No scenes detected.<br>Try writing a script with scene headings like <strong>INT. KITCHEN - DAY</strong></p>
            </div>`;
            statsBar.style.display = 'none';
            return;
        }

        const characters = extractCharacters(scenes);
        const totalWords = scenes.reduce((sum, s) => {
            const text = (s.heading || '') + ' ' + s.actionLines.join(' ') + ' ' +
                s.dialogueBlocks.map(d => d.character + ' ' + d.dialogue).join(' ');
            return sum + text.split(/\s+/).filter(w => w.length > 0).length;
        }, 0);
        const estDuration = Math.max(Math.round(totalWords / 2.5), 1); // ~150 wpm speaking pace

        // Update stats
        document.getElementById('statScenes').textContent = scenes.length;
        document.getElementById('statChars').textContent = characters.length;
        document.getElementById('statDuration').textContent = estDuration + 's';
        document.getElementById('statWords').textContent = totalWords;
        statsBar.style.display = 'flex';

        scenes.forEach((scene, i) => {
            const card = document.createElement('div');
            card.className = 'scene-card';
            card.style.animationDelay = (i * 0.08) + 's';
            card.id = 'scene-' + i;

            // Image
            const seed = getSceneImageSeed(scene, i);
            const timeInfo = getTimeInfo(scene.heading);
            const locIcon = getLocationType(scene.heading);
            const imageUrl = `https://picsum.photos/seed/${encodeURIComponent(seed)}/800/400`;

            const imageWrap = document.createElement('div');
            imageWrap.className = 'scene-image-wrap';
            imageWrap.title = 'Click to regenerate image';
            imageWrap.onclick = () => {
                const newSeed = seed + '-' + Date.now();
                imageWrap.querySelector('img').src =
                    `https://picsum.photos/seed/${encodeURIComponent(newSeed)}/800/400?t=${Date.now()}`;
                showToast('🔄 Image refreshed!');
            };

            const img = document.createElement('img');
            img.src = imageUrl;
            img.alt = scene.heading || 'Scene ' + (i + 1);
            img.loading = 'lazy';
            img.onerror = function() {
                this.style.display = 'none';
                imageWrap.style.background =
                    'linear-gradient(135deg, #1a1a35 0%, #0d0d22 30%, #1a1a35 60%, #0d0d22 100%)';
            };

            const overlay = document.createElement('div');
            overlay.className = 'scene-image-overlay';

            const badge = document.createElement('div');
            badge.className = 'scene-badge';
            badge.innerHTML = `<span class="dot"></span> Scene ${i + 1} ${locIcon}`;

            const timeBadge = document.createElement('div');
            timeBadge.className = 'scene-time-badge';
            timeBadge.textContent = `${timeInfo.icon} ${timeInfo.label}`;

            imageWrap.appendChild(img);
            imageWrap.appendChild(overlay);
            imageWrap.appendChild(badge);
            imageWrap.appendChild(timeBadge);

            // Content
            const content = document.createElement('div');
            content.className = 'scene-content';

            if (scene.heading) {
                const headingEl = document.createElement('div');
                headingEl.className = 'scene-heading';
                headingEl.textContent = '🎞 ' + scene.heading;
                content.appendChild(headingEl);
            } else if (scene.isSimple) {
                const headingEl = document.createElement('div');
                headingEl.className = 'scene-heading';
                headingEl.textContent = '🎬 Scene ' + (i + 1);
                content.appendChild(headingEl);
            }

            scene.actionLines.forEach(al => {
                const p = document.createElement('p');
                p.className = 'scene-action';
                p.textContent = al;
                content.appendChild(p);
            });

            scene.dialogueBlocks.forEach(db => {
                const dbDiv = document.createElement('div');
                dbDiv.className = 'dialogue-block';

                const charEl = document.createElement('div');
                charEl.className = 'dialogue-character';
                charEl.textContent = '🎭 ' + db.character;
                dbDiv.appendChild(charEl);

                if (db.parenthetical) {
                    const parEl = document.createElement('div');
                    parEl.className = 'dialogue-parenthetical';
                    parEl.textContent = db.parenthetical;
                    dbDiv.appendChild(parEl);
                }

                const textEl = document.createElement('div');
                textEl.className = 'dialogue-text';
                textEl.textContent = '“' + db.dialogue + '”';
                dbDiv.appendChild(textEl);

                content.appendChild(dbDiv);
            });

            // Controls
            const controls = document.createElement('div');
            controls.className = 'scene-controls';

            const playBtn = document.createElement('button');
            playBtn.className = 'btn btn-outline btn-sm';
            playBtn.textContent = '🔊 Play Scene';
            playBtn.onclick = () => speakScene(scene, i);

            const voiceSelect = document.createElement('select');
            voiceSelect.style.cssText =
                'background:var(--surface);color:var(--text);border:1px solid var(--border);padding:6px 10px;border-radius:20px;font-size:0.75rem;cursor:pointer;font-family:var(--font-body);min-width:130px;';
            voiceSelect.innerHTML = '<option value="global">🎙 Global Voice</option>';
            availableVoices.forEach((v, vi) => {
                const opt = document.createElement('option');
                opt.value = vi;
                opt.textContent = v.name.substring(0, 22);
                voiceSelect.appendChild(opt);
            });
            voiceSelect.value = 'global';
            voiceSelect.title = 'Choose voice for this scene';

            const playWithVoiceBtn = document.createElement('button');
            playWithVoiceBtn.className = 'btn btn-outline btn-sm';
            playWithVoiceBtn.textContent = '🎧 Play (Selected Voice)';
            playWithVoiceBtn.onclick = () => {
                const selVal = voiceSelect.value;
                const voiceIdx = selVal === 'global' ? globalVoiceId : parseInt(selVal);
                speakScene(scene, i, voiceIdx);
            };

            controls.appendChild(playBtn);
            controls.appendChild(voiceSelect);
            controls.appendChild(playWithVoiceBtn);

            card.appendChild(imageWrap);
            card.appendChild(content);
            card.appendChild(controls);
            output.appendChild(card);
        });

        // Add "Play All" button at the top of output
        const playAllWrap = document.createElement('div');
        playAllWrap.style.cssText = 'text-align:center;margin-bottom:8px;';
        const playAllBtn = document.createElement('button');
        playAllBtn.className = 'btn btn-gold';
        playAllBtn.textContent = '▶️ Play All Scenes';
        playAllBtn.onclick = () => playAllScenes(scenes);
        playAllWrap.appendChild(playAllBtn);
        output.insertBefore(playAllWrap, output.firstChild);

        parsedScenes = scenes;
    }

    // ──────────────────────────────────────
    //  TTS: Speak a single scene
    // ──────────────────────────────────────
    function speakScene(scene, index, voiceIdxOverride) {
        speechSynthesis.cancel();
        isPlayingAll = false;
        updatePlaybackBar(false);

        const textParts = [];
        if (scene.heading) textParts.push(scene.heading + '.');
        scene.actionLines.forEach(al => textParts.push(al));
        scene.dialogueBlocks.forEach(db => {
            textParts.push(db.character + ': ' + db.dialogue);
        });
        const fullText = textParts.join(' ');

        const utterance = new SpeechSynthesisUtterance(fullText);
        utterance.rate = 1;
        utterance.pitch = 1;
        const voiceIdx = voiceIdxOverride !== undefined ? voiceIdxOverride : globalVoiceId;
        if (!isNaN(voiceIdx) && availableVoices[voiceIdx]) {
            utterance.voice = availableVoices[voiceIdx];
        }
        utterance.onstart = () => {
            highlightScene(index);
        };
        utterance.onend = () => {
            unhighlightScene(index);
        };
        utterance.onerror = () => {
            unhighlightScene(index);
        };
        speechSynthesis.speak(utterance);
    }

    // ──────────────────────────────────────
    //  TTS: Play all scenes sequentially
    // ──────────────────────────────────────
    function playAllScenes(scenes) {
        speechSynthesis.cancel();
        isPlayingAll = true;
        currentPlayIndex = -1;
        updatePlaybackBar(true);

        function playNext() {
            currentPlayIndex++;
            if (currentPlayIndex >= scenes.length) {
                // Done
                isPlayingAll = false;
                updatePlaybackBar(false);
                unhighlightAll();
                showToast('✅ Playback complete!');
                return;
            }
            if (!isPlayingAll) {
                updatePlaybackBar(false);
                unhighlightAll();
                return;
            }
            const scene = scenes[currentPlayIndex];
            const textParts = [];
            if (scene.heading) textParts.push(scene.heading + '.');
            scene.actionLines.forEach(al => textParts.push(al));
            scene.dialogueBlocks.forEach(db => {
                textParts.push(db.character + ': ' + db.dialogue);
            });
            const fullText = textParts.join(' ');

            const utterance = new SpeechSynthesisUtterance(fullText);
            utterance.rate = 1;
            utterance.pitch = 1;
            if (!isNaN(globalVoiceId) && availableVoices[globalVoiceId]) {
                utterance.voice = availableVoices[globalVoiceId];
            }
            utterance.onstart = () => {
                highlightScene(currentPlayIndex);
                document.getElementById('playbackLabel').textContent =
                    `Playing Scene ${currentPlayIndex + 1} of ${scenes.length}...`;
                // Scroll to scene
                const card = document.getElementById('scene-' + currentPlayIndex);
                if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
            };
            utterance.onend = () => {
                unhighlightScene(currentPlayIndex);
                if (isPlayingAll) {
                    setTimeout(playNext, 400); // Small pause between scenes
                }
            };
            utterance.onerror = () => {
                unhighlightScene(currentPlayIndex);
                if (isPlayingAll) {
                    setTimeout(playNext, 400);
                }
            };
            speechSynthesis.speak(utterance);
        }
        playNext();
    }

    function stopPlayback() {
        isPlayingAll = false;
        speechSynthesis.cancel();
        updatePlaybackBar(false);
        unhighlightAll();
        showToast('⏹ Playback stopped');
    }

    function highlightScene(index) {
        unhighlightAll();
        const card = document.getElementById('scene-' + index);
        if (card) card.classList.add('playing');
    }

    function unhighlightScene(index) {
        const card = document.getElementById('scene-' + index);
        if (card) card.classList.remove('playing');
    }

    function unhighlightAll() {
        document.querySelectorAll('.scene-card.playing').forEach(c => c.classList.remove('playing'));
    }

    function updatePlaybackBar(active) {
        const bar = document.getElementById('playbackBar');
        if (active) {
            bar.classList.add('active');
            document.getElementById('playbackLabel').textContent = 'Starting playback...';
        } else {
            bar.classList.remove('active');
        }
    }

    // ──────────────────────────────────────
    //  MAIN GENERATE
    // ──────────────────────────────────────
    function generate() {
        speechSynthesis.cancel();
        isPlayingAll = false;
        updatePlaybackBar(false);
        unhighlightAll();

        const rawText = document.getElementById('script').value.trim();
        if (!rawText) {
            showToast('⚠️ Please write a script first!');
            return;
        }
        const scenes = parseScreenplay(rawText);
        parsedScenes = scenes;
        renderScenes(scenes);
        if (scenes.length > 0) {
            showToast(`✅ Generated ${scenes.length} scene${scenes.length > 1 ? 's' : ''}!`);
        }
        // Auto-save
        localStorage.setItem('movieai_lastScript', rawText);
    }

    // ──────────────────────────────────────
    //  LOAD EXAMPLE
    // ──────────────────────────────────────
    function loadExample() {
        const example = `INT. COFFEE SHOP - DAY
        The morning sun streams through large windows. A few customers sit at scattered tables.
        The smell of fresh espresso fills the air.

        DETECTIVE REID
        (sipping coffee)
        I've been following this case for three months. Nothing adds up.

        PARTNER CHEN
        The captain's getting impatient. We need answers by Friday.

        Reid pulls out a weathered photograph from his coat pocket and slides it across the table.

        DETECTIVE REID
        This is our only lead. The warehouse on 5th Street.

        EXT. WAREHOUSE DISTRICT - NIGHT
        Rain pours down on the deserted street. A single light flickers above the warehouse door.
        Thunder rumbles in the distance.

        CHEN
        (whispering)
        You sure about this? Place looks abandoned.

        REID
        That's exactly what they want us to think.`;
        document.getElementById('script').value = example;
        updateCharCount();
        showToast('📋 Example script loaded! Click "Generate Movie" to see it.');
    }

    // ──────────────────────────────────────
    //  SAVE / LOAD / EXPORT / COPY / CLEAR
    // ──────────────────────────────────────
    function saveScript() {
        const text = document.getElementById('script').value.trim();
        if (!text) {
            showToast('⚠️ Nothing to save.');
            return;
        }
        localStorage.setItem('movieai_savedScript', text);
        localStorage.setItem('movieai_lastScript', text);
        showToast('💾 Script saved to browser!');
    }

    function loadScript() {
        const saved = localStorage.getItem('movieai_savedScript');
        if (!saved) {
            showToast('📭 No saved script found.');
            return;
        }
        document.getElementById('script').value = saved;
        updateCharCount();
        showToast('📂 Script loaded!');
    }

    function exportScript() {
        if (parsedScenes.length === 0) {
            showToast('⚠️ Generate scenes first before exporting.');
            return;
        }
        let text = '=== SCREENPLAY ===\n\n';
        parsedScenes.forEach((scene, i) => {
            text += `SCENE ${i + 1}\n`;
            text += `${'═'.repeat(50)}\n`;
            if (scene.heading) text += `LOCATION: ${scene.heading}\n\n`;
            if (scene.actionLines.length > 0) {
                text += scene.actionLines.join('\n') + '\n';
            }
            scene.dialogueBlocks.forEach(db => {
                text += `\n    ${db.character}`;
                if (db.parenthetical) text += ` ${db.parenthetical}`;
                text += `\n        "${db.dialogue}"\n`;
            });
            text += '\n\n';
        });
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'screenplay_' + new Date().toISOString().slice(0, 10) + '.txt';
        a.click();
        URL.revokeObjectURL(url);
        showToast('📥 Screenplay downloaded!');
    }

    function copyScript() {
        if (parsedScenes.length === 0) {
            showToast('⚠️ Generate scenes first before copying.');
            return;
        }
        let text = '=== SCREENPLAY ===\n\n';
        parsedScenes.forEach((scene, i) => {
            text += `SCENE ${i + 1}\n${'═'.repeat(50)}\n`;
            if (scene.heading) text += `LOCATION: ${scene.heading}\n\n`;
            if (scene.actionLines.length > 0) text += scene.actionLines.join('\n') + '\n';
            scene.dialogueBlocks.forEach(db => {
                text += `\n    ${db.character}`;
                if (db.parenthetical) text += ` ${db.parenthetical}`;
                text += `\n        "${db.dialogue}"\n`;
            });
            text += '\n\n';
        });
        navigator.clipboard.writeText(text).then(() => {
            showToast('📝 Screenplay copied to clipboard!');
        }).catch(() => {
            showToast('⚠️ Failed to copy. Please try again.');
        });
    }

    function clearAll() {
        if (confirm('Clear everything? This cannot be undone.')) {
            speechSynthesis.cancel();
            isPlayingAll = false;
            updatePlaybackBar(false);
            unhighlightAll();
            parsedScenes = [];
            document.getElementById('script').value = '';
            document.getElementById('output').innerHTML = `
            <div class="empty-state">
              <span class="icon">🎞️</span>
              <p>Write a script and click <strong>"Generate Movie"</strong><br>to see your storyboard come to life.</p>
            </div>`;
            document.getElementById('statsBar').style.display = 'none';
            updateCharCount();
            localStorage.removeItem('movieai_lastScript');
            showToast('🗑 All cleared.');
        }
    }

    // ──────────────────────────────────────
    //  UTILS
    // ──────────────────────────────────────
    function updateCharCount() {
        const len = document.getElementById('script').value.length;
        document.getElementById('charCount').textContent = len.toLocaleString() + ' chars';
    }

    function showToast(msg) {
        const toast = document.getElementById('toast');
        toast.textContent = msg;
        toast.className = 'toast';
        if (msg.includes('✅') || msg.includes('💾') || msg.includes('📥') || msg.includes('📝') || msg.includes(
                '📋') || msg.includes('📂')) {
            toast.classList.add('success');
        }
        toast.classList.add('show');
        clearTimeout(toast._timeout);
        toast._timeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2200);
    }

    // ──────────────────────────────────────
    //  RESTORE LAST SCRIPT ON LOAD
    // ──────────────────────────────────────
    function restoreLastScript() {
        const lastScript = localStorage.getItem('movieai_lastScript');
        if (lastScript) {
            document.getElementById('script').value = lastScript;
            updateCharCount();
            // Auto-generate if there's content
            if (lastScript.trim()) {
                const scenes = parseScreenplay(lastScript);
                if (scenes.length > 0) {
                    renderScenes(scenes);
                }
            }
        }
    }

    // ──────────────────────────────────────
    //  KEYBOARD SHORTCUT
    // ──────────────────────────────────────
    document.addEventListener('keydown', function(e) {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
            e.preventDefault();
            generate();
        }
        if ((e.ctrlKey || e.metaKey) && e.key === 's') {
            e.preventDefault();
            saveScript();
        }
        if (e.key === 'Escape') {
            stopPlayback();
        }
    });

    // ──────────────────────────────────────
    //  INIT
    // ──────────────────────────────────────
    updateCharCount();
    restoreLastScript();

    console.log('🎬 My Movie AI App ready!');
    console.log('  ⌨ Shortcuts: Ctrl+Enter = Generate | Ctrl+S = Save | Esc = Stop playback');
    console.log('  💡 Tip: Click on a scene image to refresh it!');
    console.log('  📋 Use "Load Example" to see screenplay formatting in action.');
</script>
